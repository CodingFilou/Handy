# Fork-only: build the Windows installer (.exe) for the system-audio fork.
# Upstream release.yml signs binaries and ships all platforms; this fork has
# no signing key, so it builds unsigned Windows artifacts on demand.
# Run via: gh workflow run fork-windows-build.yml --ref feature/system-audio
name: fork-windows-build

on:
  workflow_dispatch:

jobs:
  build-windows:
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      platform: "windows-latest"
      target: "x86_64-pc-windows-msvc"
      build-args: ""
      # NOTE: `true` does NOT sign binaries here (no Azure key, no signCommand
      # in tauri.conf). It only unlocks the TAURI_SIGNING_* secrets so the
      # updater artifacts (.sig) can be created; `false` would pass empty
      # strings and fail bundling with "Missing comment in secret key".
      sign-binaries: true
      asset-prefix: "handy-sysaudio"
      upload-artifacts: true
      no-cache: true
    secrets: inherit
